<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Lounge Motion Finance</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('lm_theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#1D4E89;--btn:#1D4E89;--hd:#14283F;--bg:#F3F5F8;--card:#fff;--tx:#18222E;--mute:#64748B;--line:#E2E8F0;--green:#0F8A5F;--red:#C8343A;--org:#B7791F;--inp:#fff;--row:#F8FAFC;--tint:#EAF1FA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--pri:#6BA6E8;--btn:#2C6BB5;--hd:#0A121B;--bg:#0C131C;--card:#131D2A;--tx:#E6ECF3;--mute:#8A9BAE;--line:#243244;--inp:#0F1824;--row:#162232;--tint:#1A2B40;--green:#34C38F;--red:#F0656A;--org:#E3A94B}}
:root[data-theme="dark"]{--pri:#6BA6E8;--btn:#2C6BB5;--hd:#0A121B;--bg:#0C131C;--card:#131D2A;--tx:#E6ECF3;--mute:#8A9BAE;--line:#243244;--inp:#0F1824;--row:#162232;--tint:#1A2B40;--green:#34C38F;--red:#F0656A;--org:#E3A94B}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}button{font-family:inherit}:root[data-theme="dark"]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.5 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;padding-bottom:76px}
.hdr{background:var(--hd);color:#fff;padding:14px 16px}.wrap{max-width:1040px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:.2px}.brand span{font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:1px}
.hs{margin-left:auto;text-align:right}.hs span{display:block;font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.8px}.hs b{font-size:18px;font-weight:700}
.gear{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}
main{margin-top:16px;padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
h3{margin:0 0 12px;font-size:14px;font-weight:700;letter-spacing:.2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--pri);border-radius:8px;padding:12px 14px}
.stat span{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}.stat b{display:block;font-size:17px;font-weight:700;margin-top:2px;word-break:break-word}
.g{color:var(--green)}.r{color:var(--red)}.o{color:var(--org)}
.qk{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}.qk .btn{margin:0;padding:10px}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--inp);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:14px;padding:11px;border:1px solid var(--btn);border-radius:6px;background:var(--btn);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.btn.sec{background:var(--card);color:var(--tx);border-color:var(--line)}.btn.sb{width:auto;margin:0;padding:8px 14px}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:10px 12px;border-radius:6px;background:var(--tint)}.total b{font-size:17px;color:var(--pri)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}.filters input,.filters select{padding:8px 10px;font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 6px;border-bottom:2px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}td.n,th.n{text-align:right;white-space:nowrap}
.sm{font-size:12px;color:var(--mute)}
.act button,.lk{background:none;border:0;color:var(--pri);font-weight:600;font-size:12px;cursor:pointer;padding:2px 5px}.act .dl{color:var(--red)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.t-income{background:rgba(15,138,95,.14);color:var(--green)}.t-expense{background:rgba(200,52,58,.13);color:var(--red)}.t-withdrawal{background:rgba(183,121,31,.16);color:var(--org)}.t-basic{background:var(--tint);color:var(--pri)}.t-free{background:var(--row);color:var(--mute);border:1px solid var(--line)}.t-plus{background:rgba(15,138,95,.14);color:var(--green)}.t-premium{background:rgba(183,121,31,.18);color:var(--org)}.sbt{background:none;border:0;padding:0;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;white-space:nowrap}.sbt:hover{color:var(--pri)}
.bar{margin:10px 0}.bar div.l{display:flex;justify-content:space-between;font-size:13px}.bar .tr{height:6px;border-radius:3px;background:var(--line);margin-top:4px}.bar .tr i{display:block;height:100%;border-radius:3px;background:var(--pri)}
.empty{text-align:center;color:var(--mute);padding:22px 8px}
.rec{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.rec:last-child{border:0}
.chd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.chd select{width:auto;padding:7px 10px;font-size:13px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{background:var(--card);color:var(--tx);border:0;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}.seg button.on{background:var(--btn);color:#fff}
.xl{border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:62vh;margin-top:12px}
.xl table{border-collapse:separate;border-spacing:0;min-width:max-content;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
.xl th,.xl td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 10px;white-space:nowrap;text-transform:none;letter-spacing:0}
.xl thead th{position:sticky;background:var(--row);z-index:2;color:var(--tx);font-size:12px}
.xl .c1 th{top:0;height:24px;padding:0 10px;line-height:24px;text-align:center;color:var(--mute);font-weight:600}.xl .c2 th{top:25px}
.xl .rn{position:sticky;left:0;background:var(--row);color:var(--mute);text-align:center;font-weight:600;min-width:38px;z-index:1}.xl thead .rn{z-index:3}
.xl tbody tr:nth-child(even) td{background:var(--row)}.xl td.n,.xl th.n{text-align:right}
.xl tfoot th,.xl tfoot td{position:sticky;bottom:0;background:var(--tint);font-weight:700;z-index:2;border-top:2px solid var(--pri)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;border-top:2px solid transparent;padding:8px 0 7px;color:var(--mute);font-weight:600;font-size:10px;cursor:pointer;min-width:0}
nav svg{display:block;margin:0 auto 3px;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri);border-top-color:var(--pri)}
@media(min-width:800px){body{padding-bottom:24px}nav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:4px;padding:0}nav button{flex:none;display:flex;align-items:center;gap:7px;padding:13px 18px;font-size:13px;border-top:0;border-bottom:2px solid transparent}nav svg{margin:0;width:17px;height:17px}nav button.on{border-bottom-color:var(--pri)}}
.ov{position:fixed;inset:0;background:rgba(5,15,28,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:12px 12px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:12px}}
.acts{display:flex;gap:10px}
.big{display:block;font-size:20px;font-weight:700;margin:8px 0}.gk .btn{margin-top:4px;padding:9px;font-size:13px}
.rcp{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:12px;font:11.5px/1.45 'Courier New',Courier,monospace;overflow:auto;white-space:pre;margin:12px 0 0;max-height:46vh}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#14283F;color:#fff;padding:10px 16px;border-radius:6px;font-size:13px;z-index:30;display:none;max-width:90%}#toast.err{background:var(--red)}
</style></head><body>
<header class="hdr"><div class="wrap top"><div class="brand"><b>Lounge Motion</b><span>Finance</span></div><div class="hs"><span>Saldo Kas</span><b id="hb"></b></div><button class="gear" id="thb" data-a="theme" aria-label="Ganti tema terang atau gelap" title="Ganti tema"></button><button class="gear" data-a="set" aria-label="Data dan backup">Data</button></div></header>
<nav><button data-t="sum"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>Summary</button><button data-t="sale"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/></svg>Penjualan</button><button data-t="wal"><svg viewBox="0 0 24 24"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l2-3h12v3M16 13h3"/></svg>Dompet</button><button data-t="gaji"><svg viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6zM14 2v5h5M9 12h7M9 16h7"/></svg>Gajian</button><button data-t="mot"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg>Motion</button><button data-t="ana"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V4M16 20v-7M2 20h20"/></svg>Analitik</button><button data-t="rek"><svg viewBox="0 0 24 24"><path d="M3 4h18v16H3zM3 10h18M3 15h18M9 4v16"/></svg>Rekap</button></nav>
<main class="wrap" id="view"></main>
<div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const P0="3 Slot Inventory|B|5000;Crafting Table Basic|B|7000;Furnace Smelting|B|5000;Enchanting Table|B|10000;Anvil Combine Item|B|8000;Equip Armor Simple|B|8000;2x2 Simple Crafting|B|5000;Player Drop|B|8000;Item Showcase|B|15000;Single Calendar|B|24000;5 Slot Calendar|B|25000;10 Slot Calendar|B|26000;Server List UI|B|22000;Item Scroll Selection|B|10000;Team List UI|B|25000;Paper Scroll Items Showcase|B|12000;Hanging Photo Frames|B|18000;Item Encyclopedia|B|15000;Advancement Toast|F|0;Player Joined Chat Notification|F|0;Item Transition|F|0;Player Showcase|B|20000;4 Slot Items Showcase|B|13000;Player Kill|B|16000;Chest Showcase|B|18000;Slot Break Reveal|B|10000;Objective Scroll|B|8000;Player Invite Request|B|10000;Book Flip|B|14000;Team Card|B|10000;Villager Trading|B|25000;Polaroid Showcase|B|16000;Polaroid Showcase 2|B|17000;Player Hearts|B|12000;Toast Pop Up|B|20000;Dialog Box|B|8000;Map Item List|B|19000;Player Name Tag|B|10000;Item Progress Bar|B|19000;Simple Number Counter|F|0";
const PRODUCTS=P0.split(';').map((r,i)=>{const [n,t,p]=r.split('|');return{id:i+1,name:n,tier:t=='F'?'FREE':'BASIC',price:+p}});
const CIN=['Tambahan Modal','Pemasukan Lainnya'],COUT=['Gaji','Server & Hosting','Domain','Marketing','Operasional','Pembelian Aset','Lainnya'],PLAT=['WhatsApp','Instagram','Discord'];
const TL={income:'Income',expense:'Expense',withdrawal:'Owner Withdrawal'};
const PER=[['all','All Time'],['month','This Month'],['7d','Last 7 Days'],['30d','Last 30 Days']],perO=v=>PER.map(([k,l])=>`<option value="${k}" ${v==k?'selected':''}>${l}</option>`).join('');
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const defStaff=b=>[{id:'s_refa',name:'Refa',role:'Developer',ownerPct:80,workerPct:10,salesPct:0,basis:'omzet',fixed:0,dedPct:0,dedLabel:''},{id:'s_fiqun',name:'Fiqun',role:'Marketing',ownerPct:0,workerPct:0,salesPct:10,basis:b=='bersih'?'bersih':'omzet',fixed:0,dedPct:0,dedLabel:''}];
const S={products:ld('lm_products',null)||PRODUCTS,sales:ld('lm_sales',[]),wallet:ld('lm_wallet',[]),cfg:ld('lm_cfg',{basis:'omzet'}),staff:ld('lm_staff',null)||defStaff(ld('lm_cfg',{basis:'omzet'}).basis)};
function persist(){try{localStorage.setItem('lm_products',JSON.stringify(S.products));localStorage.setItem('lm_sales',JSON.stringify(S.sales));localStorage.setItem('lm_wallet',JSON.stringify(S.wallet));localStorage.setItem('lm_cfg',JSON.stringify(S.cfg));localStorage.setItem('lm_staff',JSON.stringify(S.staff))}catch(e){toast('Penyimpanan browser tidak tersedia','err')}}
/* migrasi gajian lama (kunci berbasis nama) ke kunci berbasis id karyawan */
function migrate(){S.wallet.forEach(w=>{const m=w.ak&&/^wk:(Refa|Fiqun):/.exec(w.ak);if(m){const n=m[1];w.ak=w.ak.replace('wk:'+n+':','wk:'+(n=='Refa'?'s_refa':'s_fiqun')+':');w.meta=w.meta||{name:n,pos:'Gaji'}}})}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=n=>(n<0?'-':'')+'Rp'+Math.abs(n).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addD=n=>{const d=new Date(today()+'T00:00:00');d.setDate(d.getDate()+n);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dmy=d=>d.split('-').reverse().join('/');
const inR=(d,p)=>p=='all'||(p=='month'&&d.slice(0,7)==today().slice(0,7))||(p=='7d'&&d>=addD(-6)&&d<=today())||(p=='30d'&&d>=addD(-29)&&d<=today());
const sortW=a=>[...a].sort((x,y)=>y.date.localeCompare(x.date)||(y.ts||0)-(x.ts||0));
const sortA=a=>[...a].sort((x,y)=>x.date.localeCompare(y.date)||(x.ts||0)-(y.ts||0));
function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'err':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function calc(){let i=0,e=0,w=0;S.wallet.forEach(t=>{if(t.type=='income')i+=t.amount;else if(t.type=='expense')e+=t.amount;else w+=t.amount});return{i,e,w,bal:i-e-w}}

/* modal */
function modal(title,body,okL,onOk,cancelL='Batal'){$('#modal').innerHTML=`<div class="ov"><div class="sheet"><h3>${title}</h3>${body}<div class="acts">${cancelL?`<button class="btn sec" id="mc">${cancelL}</button>`:''}${okL?`<button class="btn" id="mo">${okL}</button>`:''}</div></div></div>`;
 if($('#mc'))$('#mc').onclick=closeM;if($('#mo'))$('#mo').onclick=()=>{if(onOk()!==false)closeM()}}
const closeM=()=>$('#modal').innerHTML='';
function confirmM(msg,fn){modal('Konfirmasi',`<p>${msg}</p>`,'Ya, lanjutkan',fn)}
function formM(title,fields,v,onSave){
 const body=fields.map(([k,l,t,o])=>`<label for="f_${k}">${l}</label>`+(t=='select'?`<select id="f_${k}">${o.map(x=>`<option ${v[k]==x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:t=='area'?`<textarea id="f_${k}" rows="2">${esc(v[k]||'')}</textarea>`:`<input id="f_${k}" type="${t=='num'?'number':t}" ${t=='num'?'min="0" step="1" inputmode="numeric"':''} value="${esc(v[k]??'')}">`)).join('');
 modal(title,body,'Simpan',()=>{const o={};for(const [k,l,t] of fields){let x=$('#f_'+k).value.trim();
  if(t=='num'){x=Number(x);if(!(x>0)||!Number.isFinite(x)){toast(l+' harus berupa angka lebih dari 0','err');return false}}
  else if(t!='area'&&!x&&!(k=='cust')){toast(l+' wajib diisi','err');return false}
  o[k]=x}return onSave(o)})}

/* state & render */
let ed=null,tab='sum',cf='all',rk='sales',rp='all',curSh=null,ms={k:'id',d:1};const F={sq:'',sp:'',sper:'all',wq:'',wc:'',wt:'',wf:'',wto:'',mq:''};
function render(){const c=calc();thLbl();$('#hb').textContent=fmt(c.bal);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('#view').innerHTML={sum:()=>vSum(c),sale:vSale,wal:()=>vWal(c),gaji:vGaji,mot:vMot,rek:vRek,ana:vAna}[tab]();
 if(tab=='sale'){initForm();sTbl()}if(tab=='wal')wTbl();if(tab=='mot')mTbl();if(tab=='sum')$('#chb').innerHTML=chart(cf)}
function vSum(c){const sa=S.sales,rev=sa.reduce((a,s)=>a+s.total,0),qty=sa.reduce((a,s)=>a+s.qty,0),m={};sa.forEach(s=>m[s.name]=(m[s.name]||0)+s.qty);
 const top=Object.entries(m).sort((a,b)=>b[1]-a[1])[0],ex={};S.wallet.filter(t=>t.type=='expense').forEach(t=>ex[t.cat]=(ex[t.cat]||0)+t.amount);
 const ec=Object.entries(ex).sort((a,b)=>b[1]-a[1]),rc=sortW(S.wallet).slice(0,6);
 return `<div class="grid g4" style="margin-bottom:12px"><div class="stat"><span>Total Pemasukan</span><b class="g">${fmt(c.i)}</b></div><div class="stat"><span>Total Pengeluaran</span><b class="r">${fmt(c.e)}</b></div><div class="stat"><span>Owner Withdrawal</span><b class="o">${fmt(c.w)}</b></div><div class="stat"><span>Saldo Kas</span><b>${fmt(c.bal)}</b></div></div>
<div class="card"><h3>Sales Overview</h3><div class="grid g4"><div><span class="sm">Total transaksi</span><br><b>${sa.length}</b></div><div><span class="sm">Motion terjual</span><br><b>${qty}</b></div><div><span class="sm">Pendapatan penjualan</span><br><b>${fmt(rev)}</b></div><div><span class="sm">Rata-rata transaksi</span><br><b>${fmt(sa.length?Math.round(rev/sa.length):0)}</b></div></div><div class="hint">Motion paling laris: <b>${top?esc(top[0])+' ('+top[1]+' terjual)':'-'}</b></div></div>
<div class="card"><div class="chd"><h3 style="margin:0">Cash Flow</h3><select id="cf" aria-label="Periode">${perO(cf)}</select></div><div id="chb" style="margin-top:12px"></div></div>
<div class="card"><h3>Expense Overview</h3>${ec.length?ec.map(([k,v])=>`<div class="bar"><div class="l"><span>${esc(k)}</span><b>${fmt(v)}</b></div><div class="tr"><i style="width:${v/c.e*100}%"></i></div></div>`).join(''):'<div class="empty">Belum ada pengeluaran</div>'}</div>
<div class="card"><h3>Recent Transactions</h3>${rc.length?rc.map(rw).join(''):'<div class="empty">Belum ada transaksi. Mulai dari tab Penjualan atau Dompet.</div>'}</div>`}
const sign=t=>t.type=='income'?'+ '+fmt(t.amount):'- '+fmt(t.amount);
const cl=t=>t.type=='income'?'g':t.type=='expense'?'r':'o';
const rw=t=>`<div class="rec"><div><b>${esc(t.desc)}</b><div class="sm">${dmy(t.date)} · ${esc(t.cat)}</div></div><b class="${cl(t)}" style="white-space:nowrap">${sign(t)}</b></div>`;
function chart(p){const L=S.wallet.filter(t=>inR(t.date,p));if(!L.length)return '<div class="empty">Belum ada data pada periode ini</div>';
 const bm=new Set(L.map(t=>t.date)).size>31,m={};L.forEach(t=>{const k=bm?t.date.slice(0,7):t.date;m[k]=m[k]||{i:0,o:0};t.type=='income'?m[k].i+=t.amount:m[k].o+=t.amount});
 const ks=Object.keys(m).sort().slice(-24),mx=Math.max(1,...ks.map(k=>Math.max(m[k].i,m[k].o))),W=600,H=170,bw=W/ks.length,w=Math.max(Math.min(bw*.32,18),2);let s='';
